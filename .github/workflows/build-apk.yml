name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_keystore: ${{ steps.check_secret.outputs.has_keystore }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform (Capacitor)
        run: npx cap add android

      - name: Générer icônes & splash
        run: npx @capacitor/assets generate --android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Add camera permission (scanner QR/code-barres)
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />' android/app/src/main/AndroidManifest.xml

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tendry-epicerie-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Check if release keystore secret is set
        id: check_secret
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================
  # Job faharoa: APK/AAB "signé" ho an'ny Play Store.
  # Mandeha ihany io raha efa voatahiry ao amin'ny GitHub Secrets
  # ny KEYSTORE_BASE64 (jereo ny README.md hahafantarana ny fomba).
  # ============================================================
  build-release:
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.outputs.has_keystore == 'true'
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform (Capacitor)
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Add camera permission (scanner QR/code-barres)
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />' android/app/src/main/AndroidManifest.xml

      - name: Decode keystore from secret
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"

      - name: Insert signing config into build.gradle
        run: python3 scripts/patch_signing.py

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build signed AAB (ho an'ny Play Store)
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Build signed APK (ho an'ny fizarana mivantana)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Remove keystore from runner
        if: always()
        run: rm -f "$KEYSTORE_PATH"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: tendry-epicerie-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: tendry-epicerie-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
