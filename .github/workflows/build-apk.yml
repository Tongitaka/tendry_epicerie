name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform (mamorona ny dossier android/)
        run: npx cap add android

      - name: Generate Android icons & splash screen (avy amin'ny resources/)
        run: npx capacitor-assets generate --android

      - name: Generate PWA icons (www/icons)
        run: |
          mkdir -p www/icons
          SRC="resources/icon.png"
          if [ ! -f "$SRC" ]; then SRC="resources/icon-only.png"; fi
          if [ ! -f "$SRC" ]; then SRC="resources/logo.png"; fi
          convert "$SRC" -resize 192x192 www/icons/icon-192.png
          convert "$SRC" -resize 512x512 www/icons/icon-512.png

      - name: Sync Capacitor (mandefa ny www/ + ny plugins ao anaty android/)
        run: npx cap sync android

      - name: Patch AndroidManifest.xml (alalana Camera + Storage)
        run: python3 patch_manifest.py

      - name: Patch MainActivity.java (fangatahana alalana Camera/Storage)
        run: python3 patch_mainactivity.py

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tendry-epicerie-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-release:
    name: Build Signed AAB/APK (Play Store)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android icons & splash screen (avy amin'ny resources/)
        run: npx capacitor-assets generate --android

      - name: Generate PWA icons (www/icons)
        run: |
          mkdir -p www/icons
          SRC="resources/icon.png"
          if [ ! -f "$SRC" ]; then SRC="resources/icon-only.png"; fi
          if [ ! -f "$SRC" ]; then SRC="resources/logo.png"; fi
          convert "$SRC" -resize 192x192 www/icons/icon-192.png
          convert "$SRC" -resize 512x512 www/icons/icon-512.png

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch AndroidManifest.xml (alalana Camera + Storage)
        run: python3 patch_manifest.py

      - name: Patch MainActivity.java (fangatahana alalana Camera/Storage)
        run: python3 patch_mainactivity.py

      # Ireto dingana manaraka ireto dia mandeha raha efa voapetraka ny Secrets efatra
      # (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Raha mbola tsy
      # voapetraka ireo dia tsy manao na inona na inona ity job ity (tsy hisy hadisoana).
      - name: Check signing secrets
        id: checksecrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore
        if: steps.checksecrets.outputs.has_secrets == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/tendry-release.keystore"

      - name: Patch signingConfigs (build.gradle)
        if: steps.checksecrets.outputs.has_secrets == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/tendry-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 patch_signing.py

      - name: Grant execute permission for gradlew
        if: steps.checksecrets.outputs.has_secrets == 'true'
        run: chmod +x android/gradlew

      - name: Build release AAB (Play Store)
        if: steps.checksecrets.outputs.has_secrets == 'true'
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/tendry-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Build release APK (mivantana amin'ny téléphone)
        if: steps.checksecrets.outputs.has_secrets == 'true'
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/tendry-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release AAB
        if: steps.checksecrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tendry-epicerie-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload release APK
        if: steps.checksecrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tendry-epicerie-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
